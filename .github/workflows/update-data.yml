name: Update price data

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-data

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt pytest

      - name: Test scraper
        run: python -m pytest -q scraper/tests

      # Fails the job (and emails you) if any source is blocked or returns bad data.
      # data.json is only written when every source succeeds.
      - name: Scrape
        run: python scraper/build.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Data update $(date -u +%F)"
          git push

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy explicitly.
  deploy:
    needs: scrape
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
